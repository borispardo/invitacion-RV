<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invitación de grado · Rossy, Damian y Boris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Great+Vibes&display=swap">
<style>
:root{--page:#efe3cf;--paper:#fbf4e8;--ink:#5e3716;--gold:#a8742f;--chip:#f1dfc3;--shadow:rgba(94,55,22,.18);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#1d1510;--shadow:rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--page:#1d1510;--shadow:rgba(0,0,0,.5)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--page);font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;color:var(--ink);min-height:100dvh;display:flex;justify-content:center;align-items:flex-start}
.paper{position:relative;width:100%;max-width:520px;min-height:100dvh;background:linear-gradient(180deg,#fdf8ef,var(--paper));overflow:hidden;box-shadow:0 0 40px var(--shadow)}
.paper::after{content:"";position:absolute;inset:10px;border:1px solid var(--gold);pointer-events:none;opacity:.8}
.view{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 28px;transition:opacity .7s ease,transform .7s ease}
.deco{position:absolute;pointer-events:none}
.tl{top:12px;left:12px;width:36%}.br{bottom:12px;right:12px;width:32%}
.cap{width:min(46%,190px);margin-bottom:8px}
.t1{font-size:clamp(30px,9vw,44px);letter-spacing:.06em;font-weight:600;margin:6px 0 0}
.names{font-family:"Great Vibes","Brush Script MT",cursive;color:var(--gold);font-size:clamp(34px,10.5vw,54px);line-height:1.1;margin:2px 0 14px}
.div{display:flex;align-items:center;gap:12px;width:70%;margin:6px auto}
.div i{flex:1;height:1px;background:var(--gold)}.div b{width:9px;height:9px;background:var(--gold);transform:rotate(45deg)}
.para{font-size:clamp(20px,5.5vw,26px);margin:22px 0 0;letter-spacing:.04em}
.who{font-family:"Great Vibes","Brush Script MT",cursive;font-size:clamp(40px,12vw,62px);line-height:1.15;margin:4px 0 26px;color:var(--ink);overflow-wrap:anywhere}
button{font:600 clamp(19px,5vw,23px) "Cormorant Garamond",Georgia,serif;color:var(--ink);background:var(--chip);border:1px solid var(--gold);border-radius:999px;padding:13px 30px;cursor:pointer;display:inline-flex;align-items:center;gap:10px;box-shadow:0 4px 14px var(--shadow);transition:transform .15s}
button:hover{transform:translateY(-1px)}button:active{transform:scale(.97)}
button svg{width:22px;height:22px}
#card{opacity:0;visibility:hidden;transform:translateY(14px);padding:0;justify-content:flex-start;overflow-y:auto}
#card img{width:100%;display:block}
.open #cover{opacity:0;visibility:hidden;transform:translateY(-14px)}
.open #card{opacity:1;visibility:visible;transform:none}
.open .paper::after{display:none}
</style>
</head>
